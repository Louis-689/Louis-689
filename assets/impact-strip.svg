<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Indicadores de impacto de Luis Cava</title>
  <desc id="desc">Panel animado con ganancias, equipo, reconocimientos y objetivo profesional.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1">
      <stop stop-color="#eadcc2"/>
      <stop offset=".5" stop-color="#f5ead5"/>
      <stop offset="1" stop-color="#dfc7aa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="16" fill="url(#paper)"/>
  <g fill="none" stroke="#385747" stroke-linecap="round" opacity=".62">
    <g stroke-width="3">
      <path d="M4 4C28 20 18 55 48 70S76 112 60 150"/>
      <path d="M1196 4C1172 20 1182 55 1152 70S1124 112 1140 150"/>
    </g>
    <g fill="#5f8f68" stroke="none">
      <ellipse cx="28" cy="35" rx="6" ry="12" transform="rotate(-45 28 35)"/>
      <ellipse cx="50" cy="76" rx="6" ry="12" transform="rotate(48 50 76)"/>
      <ellipse cx="64" cy="119" rx="6" ry="12" transform="rotate(-42 64 119)"/>
      <ellipse cx="1172" cy="35" rx="6" ry="12" transform="rotate(45 1172 35)"/>
      <ellipse cx="1150" cy="76" rx="6" ry="12" transform="rotate(-48 1150 76)"/>
      <ellipse cx="1136" cy="119" rx="6" ry="12" transform="rotate(42 1136 119)"/>
    </g>
    <animate attributeName="opacity" values=".48;.76;.48" dur="5s" repeatCount="indefinite"/>
  </g>
  <path d="M40 38H1160M40 182H1160" stroke="#22362f" stroke-opacity=".22"/>
  <g stroke="#22362f" stroke-opacity=".16"><path d="M300 58V166M600 58V166M900 58V166"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#22362f">
    <g transform="translate(150 0)">
      <text y="105" font-family="Georgia,serif" font-size="42" font-weight="700">S/ 30K+</text>
      <text y="135" font-size="11" letter-spacing="3">GANANCIAS GENERADAS</text>
    </g>
    <g transform="translate(450 0)">
      <text y="105" font-family="Georgia,serif" font-size="42" font-weight="700">10</text>
      <text y="135" font-size="11" letter-spacing="3">PERSONAS LIDERADAS</text>
    </g>
    <g transform="translate(750 0)">
      <text y="105" font-family="Georgia,serif" font-size="42" font-weight="700">13</text>
      <text y="135" font-size="11" letter-spacing="3">RECONOCIMIENTOS</text>
    </g>
    <g transform="translate(1050 0)">
      <text y="105" font-family="Georgia,serif" font-size="42" font-weight="700">2027</text>
      <text y="135" font-size="11" letter-spacing="3">OBJETIVO PROFESIONAL</text>
    </g>
  </g>
  <rect x="40" y="38" width="150" height="2" fill="#c56d48">
    <animate attributeName="x" values="40;1010;40" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="150;70;150" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g fill="#c56d48">
    <circle cx="150" cy="166" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="166" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".45s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="166" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="166" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin="1.35s" repeatCount="indefinite"/></circle>
  </g>
</svg>
